name: turnos2
description: Calendario de turnos con gestion de nomina y finanzas.
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.5.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^2.5.1
  drift: ^2.20.0
  sqlite3_flutter_libs: ^0.5.24
  fl_chart: ^0.68.0
  flutter_local_notifications: ^17.2.3
  google_fonts: ^6.2.1
  flutter_sticky_header: ^0.11.0
  timezone: ^0.9.4
  path_provider: ^2.1.4
  path: ^1.9.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  drift_dev: ^2.20.0
  build_runner: ^2.4.11
  flutter_launcher_icons: ^0.13.1

dependency_overrides:
  path_provider_android: 2.2.23

flutter:
  uses-material-design: true

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "nuevo_icono.png"
  background_color: "#E0E5FF"
  adaptive_icon_background: "#E0E5FF"
  adaptive_icon_foreground: "nuevo_icono.png"
